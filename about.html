<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamirageStudio | 我们</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="Picture/DMI_Logo.svg">
    <style>
        /* 关于页面特定样式 */
        .about-page {
            padding-top: 120px;
            padding-bottom: var(--spacing-xxl);
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: var(--spacing-xl);
            padding-right: var(--spacing-xl);
        }
        
        .page-title {
            font-size: 2.5rem;
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-xl);
            text-align: center;
            color: var(--color-primary);
        }
        
        .page-subtitle {
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            text-align: center;
            max-width: 800px;
            margin: 0 auto var(--spacing-xxl);
            line-height: 1.6;
        }
        
        .members-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                    gap: var(--spacing-xl);
                    margin-bottom: var(--spacing-xxl);
                }
        
                .member-card {
                    background-color: var(--color-surface);
                    border-radius: 16px;
                    overflow: hidden;
                    box-shadow: var(--shadow-md);
                    transition: transform 0.3s ease, box-shadow 0.3s ease;
                    cursor: pointer;
                    display: flex;
                    flex-direction: column;
                    padding: 24px;
                    height: auto;
                    min-height: 400px;
                }
        
                .member-card:hover {
                    transform: translateY(-5px);
                    box-shadow: var(--shadow-lg);
                }
        
                .member-header {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                    margin-bottom: 12px;
                }
        
                /* 圆形自定义头像 */
                .member-avatar-custom {
                    width: 60px;
                    height: 60px;
                    min-width: 60px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                    transition: transform 0.3s ease, box-shadow 0.3s ease;
                }
        
                .member-avatar-custom:hover {
                    transform: scale(1.05);
                    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
                }
        
                .member-avatar-emoji {
                    font-size: 1.8rem;
                }
        
                .member-name-group {
                    flex: 1;
                }
        
                .member-name {
                    font-size: 1.25rem;
                    font-weight: var(--font-weight-bold);
                    margin-bottom: 4px;
                    color: var(--color-text);
                    line-height: 1.3;
                }
        
                .member-role {
                    color: var(--color-text-secondary);
                    font-weight: 500;
                    font-size: 0.875rem;
                    display: flex;
                    align-items: center;
                    gap: 6px;
                }
        
                .member-role i {
                    color: var(--color-primary);
                    font-size: 0.75rem;
                }
        
                .member-tags {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px;
                    margin-bottom: 16px;
                }
        
                .member-tag {
                    padding: 6px 14px;
                    border-radius: 20px;
                    background-color: var(--color-primary)15;
                    color: var(--color-primary);
                    font-size: 0.75rem;
                    font-weight: 500;
                }
        
                .member-divider {
                    height: 1px;
                    background-color: var(--color-border);
                    margin-bottom: 16px;
                }
        
                .member-bio {
                    color: var(--color-text-secondary);
                    line-height: 1.6;
                    margin-bottom: auto;
                    font-size: 0.875rem;
                    text-align: left;
                    display: -webkit-box;
                    -webkit-line-clamp: 3;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }
        
                .member-meta {
                    margin-top: 20px;
                    padding-top: 16px;
                    border-top: 1px solid var(--color-border);
                    display: flex;
                    gap: 12px;
                }
        
                .member-meta span {
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    color: var(--color-primary);
                    font-size: 0.875rem;
                    font-weight: 500;
                    cursor: pointer;
                    transition: opacity 0.2s ease;
                    padding: 8px 12px;
                    border-radius: 8px;
                    background-color: var(--color-primary)10;
                }
        
                .member-meta span:hover {
                    opacity: 0.8;
                    background-color: var(--color-primary)20;
                }        /* 加入我们板块 */
        .join-section {
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xxl);
            text-align: center;
            box-shadow: var(--shadow-md);
        }
        
        .join-title {
            font-size: 2rem;
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-lg);
            color: var(--color-text);
        }
        
        .join-description {
            color: var(--color-text-secondary);
            max-width: 800px;
            margin: 0 auto var(--spacing-xl);
            line-height: 1.6;
        }
        
        .join-roles {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            justify-content: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .join-role {
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            background-color: var(--color-background);
            color: var(--color-text);
            border: 2px solid var(--color-border);
            transition: all 0.3s ease;
        }
        
        .join-role:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        
        .join-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .join-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-full);
            background-color: var(--color-primary);
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .join-link:hover {
            background-color: var(--color-secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .join-note {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }
        
        /* 成员详情浮层 */
        .member-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }
        
        .member-modal.active {
            display: flex;
        }
        
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-overlay);
            backdrop-filter: blur(10px);
            z-index: 2001;
        }
        
        .modal-content {
            position: relative;
            z-index: 2002;
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }
        
        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-background);
            color: var(--color-text);
            transition: background-color 0.3s ease;
            cursor: pointer;
        }
        
        .modal-close:hover {
            background-color: var(--color-primary);
            color: white;
        }
        
        .modal-body {
            padding: var(--spacing-lg);
        }
        
        .modal-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .modal-role {
            text-align: center;
            color: var(--color-primary);
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: var(--spacing-lg);
        }
        
        .modal-bio {
            color: var(--color-text);
            line-height: 1.8;
            margin-bottom: var(--spacing-lg);
            white-space: pre-line;
        }
        
        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            justify-content: center;
        }
        
        .modal-tag {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-full);
            background-color: var(--color-primary);
            color: white;
            font-size: 0.875rem;
        }
        
        .modal-links {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .modal-link {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-full);
            background-color: var(--color-background);
            color: var(--color-text);
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-decoration: none;
        }
        
        .modal-link:hover {
            background-color: var(--color-primary);
            color: white;
        }
        
        .no-members {
            text-align: center;
            padding: var(--spacing-xxl);
            color: var(--color-text-secondary);
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .about-page {
                padding-top: 180px;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .members-grid {
                grid-template-columns: 1fr;
            }
            
            .join-section {
                padding: var(--spacing-xl);
            }
            
            .join-roles {
                flex-direction: column;
                align-items: center;
            }
            
            .member-modal {
                padding: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景容器 -->
    <div class="dynamic-bg"></div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo-link">
                    <div class="logo-svg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 150 150.1" fill="none" class="logo-icon">
                            <path class="logo-path" stroke="currentColor" stroke-width="20" stroke-linecap="round" d="M10 140C45.8985 140 75 110.899 75 75C75 39.1015 45.8985 10 10 10"></path>
                            <path class="logo-path" stroke="currentColor" stroke-width="20" stroke-linecap="round" d="M75 75C75 39.1015 104.101 10 140 10"></path>
                            <path class="logo-path" stroke="currentColor" stroke-width="20" stroke-linecap="round" d="M10 35L10 115"></path>

                    <span class="logo-text">DreamirageStudio</span>

            </div>

            <div class="nav-center">
                <a href="index.html" class="nav-btn" data-page="home">主页</a>
                <a href="projects.html" class="nav-btn" data-page="projects">作品集</a>
                <a href="about.html" class="nav-btn active" data-page="about">我们</a>
                <a href="services.html" class="nav-btn" data-page="services">服务</a>
                <div class="nav-indicator"></div>
            </div>

            <div class="nav-right">
                <div class="social-icons">
                    <a href="https://space.bilibili.com/3546558473702169" target="_blank" class="social-icon" title="Bilibili">
                        <i class="fab fa-bilibili"></i>
                    </a>

                    </a>
                    <a href="https://github.com/Mirage-BIN" target="_blank" class="social-icon" title="GitHub">

                </div>
                <div class="theme-switcher">
                    <button class="theme-btn" id="themeToggle">
                        <i class="fas fa-palette"></i>
                        <span>主题</span>
                    </button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <div class="theme-option" data-theme="dark">暗夜</div>
                        <div class="theme-option" data-theme="light">明亮</div>
                        <div class="theme-option" data-theme="macaron">马卡龙</div>
                        <div class="theme-option" data-theme="morandi">莫兰迪</div>

            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="about-page">
        <h1 class="page-title">我们</h1>
        <p class="page-subtitle">一群充满激情的创造者，致力于将天马行空的想象转化为触手可及的现实。我们相信技术的力量，更相信创意的价值。</p>
        
        <!-- 成员网格 -->
        <div class="members-grid" id="membersGrid">
            <!-- 成员卡片将通过JavaScript动态加载 -->
            <div class="no-members">
                <i class="fas fa-spinner fa-spin"></i> 正在加载团队成员...
            </div>
        </div>
        
        <!-- 加入我们板块 -->
        <section class="join-section">
            <h2 class="join-title">加入我们</h2>
            <p class="join-description">
                我们正在寻找志同道合的伙伴，一起创造令人惊叹的作品。无论你是技术大神、设计天才，还是创意策划，这里都有你的舞台。
            </p>
            
            <div class="join-roles">
                <div class="join-role">程序开发</div>
                <div class="join-role">美术设计</div>
                <div class="join-role">创意策划</div>
                <div class="join-role">运营推广</div>
                <div class="join-role">项目管理</div>
            </div>
            
            <div class="join-action">
                <a href="https://www.xiaohongshu.com/user/profile/5f191af0000000000101ea29" target="_blank" class="join-link">
                    <i class="fab fa-weixin"></i>
                    添加小红书主页账号申请加入
                </a>
                <p class="join-note">请备注"加入DreamirageStudio"并简要介绍自己，我们会尽快与你联系。</p>
            </div>
        </section>
    </main>

    <!-- 成员详情浮层 -->
    <div class="member-modal" id="memberModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">成员姓名</h2>
                <div class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-avatar" id="modalAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="modal-role" id="modalRole">角色</div>
                <div class="modal-bio" id="modalBio">
                    成员详细介绍将在这里显示。
                </div>
                <div class="modal-tags" id="modalTags">
                    <!-- 标签将通过JavaScript动态添加 -->
                </div>
                <div class="modal-links" id="modalLinks">
                    <!-- 链接将通过JavaScript动态添加 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="script.js"></script>
    <script src="theme.js"></script>
    <script src="members/members-data.js" defer></script>
    <script src="about.js" defer></script>
</body>
</html>
